name: PEOPLEENT technical SEO and content QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '**/index.html'
      - 'functions/_middleware.js'
      - 'robots.txt'
      - 'scripts/verify_site_seo.py'
      - 'scripts/check_live_indexability.py'
      - 'scripts/test_live_indexability.py'
      - 'tools/gsc-review.html'
      - 'assets/gsc-review-core.mjs'
      - 'assets/gsc-review-ui.mjs'
      - 'scripts/test_gsc_review.mjs'
      - '.github/workflows/live-indexability.yml'
      - 'scripts/test_middleware_seo.mjs'
      - 'assets/peopleent-engagement.js'
      - 'scripts/test_engagement_events.mjs'
      - 'insight/**'
      - 'assets/insight-article.css'
      - 'assets/insight-next-steps.css'
      - 'scripts/insight-topic-journeys.json'
      - 'sitemap.xml'
      - 'rss.xml'
      - 'scripts/verify_insight_release.py'
      - 'scripts/test_insight_interactions.mjs'
      - 'assets/insight-tools.js'
      - 'assets/insight-tools.css'
      - '.github/workflows/insight-quality.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '**/index.html'
      - 'functions/_middleware.js'
      - 'robots.txt'
      - 'scripts/verify_site_seo.py'
      - 'scripts/check_live_indexability.py'
      - 'scripts/test_live_indexability.py'
      - 'tools/gsc-review.html'
      - 'assets/gsc-review-core.mjs'
      - 'assets/gsc-review-ui.mjs'
      - 'scripts/test_gsc_review.mjs'
      - '.github/workflows/live-indexability.yml'
      - 'scripts/test_middleware_seo.mjs'
      - 'assets/peopleent-engagement.js'
      - 'scripts/test_engagement_events.mjs'
      - 'insight/**'
      - 'assets/insight-article.css'
      - 'assets/insight-next-steps.css'
      - 'scripts/insight-topic-journeys.json'
      - 'sitemap.xml'
      - 'rss.xml'
      - 'scripts/verify_insight_release.py'
      - 'scripts/test_insight_interactions.mjs'
      - '.github/workflows/insight-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check standalone JavaScript syntax
        run: |
          node --check assets/insight-tools.js
          node --check assets/peopleent-engagement.js
          node --check scripts/test_engagement_events.mjs
          node --check scripts/test_insight_interactions.mjs
          node --check assets/gsc-review-core.mjs
          node --check assets/gsc-review-ui.mjs
          node --check scripts/test_gsc_review.mjs
      - name: Validate all published pages, canonicals, sitemap and links
        run: python3 scripts/verify_site_seo.py
      - name: Test deployed-indexability checker without external traffic
        run: python3 scripts/test_live_indexability.py
      - name: Test Search Console CSV import and status reporting
        run: node scripts/test_gsc_review.mjs
      - name: Validate sitemap, RSS, JSON-LD, canonical, article depth and internal links
        run: python3 scripts/verify_insight_release.py
      - name: Test preview and production SEO response headers
        run: node scripts/test_middleware_seo.mjs
      - name: Test privacy-safe GA4 engagement events
        run: node scripts/test_engagement_events.mjs
      - name: Test actual insight page interactions in Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/test_insight_interactions.mjs
